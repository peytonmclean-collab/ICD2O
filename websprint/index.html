<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkers Sprint</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <h1>Checkers Sprint</h1>
      <p class="subtitle">Click a piece, then click a valid square to move. Capture when available.</p>
    </header>

    <section class="game-panel">
      <div class="status-row">
        <div class="status-item">Current player: <span id="current-player">Red</span></div>
        <button id="reset-button" type="button">Reset Game</button>
      </div>
      <div id="board" class="board"></div>
      <div id="message" class="message"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
